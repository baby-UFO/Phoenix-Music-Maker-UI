<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Phoenix Music Maker">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#1a1010"/>
      <stop offset="100%" stop-color="#050508"/>
    </radialGradient>
    <linearGradient id="flameCore" x1="32" y1="14" x2="32" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffe566"/>
      <stop offset="35%" stop-color="#ff9a1f"/>
      <stop offset="70%" stop-color="#ff3d1a"/>
      <stop offset="100%" stop-color="#b01010"/>
    </linearGradient>
    <linearGradient id="flameHot" x1="32" y1="18" x2="32" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff6a8"/>
      <stop offset="55%" stop-color="#ffb020"/>
      <stop offset="100%" stop-color="#ff5a00"/>
    </linearGradient>
    <linearGradient id="wingL" x1="8" y1="28" x2="28" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff1a0a"/>
      <stop offset="45%" stop-color="#ff7a14"/>
      <stop offset="100%" stop-color="#ffd24a"/>
    </linearGradient>
    <linearGradient id="wingR" x1="56" y1="28" x2="36" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff1a0a"/>
      <stop offset="45%" stop-color="#ff7a14"/>
      <stop offset="100%" stop-color="#ffd24a"/>
    </linearGradient>
  </defs>

  <!-- Badge -->
  <circle cx="32" cy="32" r="31" fill="url(#bg)"/>
  <circle cx="32" cy="32" r="31" fill="none" stroke="#2a1510" stroke-width="1.5" opacity="0.9"/>

  <!-- Outer flicker flames (animated) -->
  <g id="flicker">
    <path fill="#ff2a0a" opacity="0.85" d="M12 30c-2-6 1-12 5-14-1 5 1 9 4 12-5 0-8 1-9 2z"/>
    <path fill="#ff2a0a" opacity="0.85" d="M52 30c2-6-1-12-5-14 1 5-1 9-4 12 5 0 8 1 9 2z"/>
    <path fill="#ff4500" opacity="0.75" d="M22 14c0-4 4-8 7-9-2 4-1 7 1 9-4 0-7 0-8 0z"/>
    <path fill="#ff4500" opacity="0.75" d="M42 14c0-4-4-8-7-9 2 4 1 7-1 9 4 0 7 0 8 0z"/>
    <animate attributeName="opacity" values="0.7;1;0.65;1;0.7" dur="1.6s" repeatCount="indefinite"/>
  </g>

  <!-- Left wing -->
  <path fill="url(#wingL)" d="M31 34
    C26 30 18 26 12 22
    C9 20 7 16 8 12
    C11 15 14 18 16 16
    C18 13 16 8 18 5
    C21 10 24 14 26 18
    C28 15 27 9 29 6
    C30 12 31 20 31 28 Z"/>

  <!-- Right wing -->
  <path fill="url(#wingR)" d="M33 34
    C38 30 46 26 52 22
    C55 20 57 16 56 12
    C53 15 50 18 48 16
    C46 13 48 8 46 5
    C43 10 40 14 38 18
    C36 15 37 9 35 6
    C34 12 33 20 33 28 Z"/>

  <!-- Body + chest -->
  <path fill="url(#flameCore)" d="M32 18
    C28 22 26 28 26 34
    C26 42 28 48 32 52
    C36 48 38 42 38 34
    C38 28 36 22 32 18 Z"/>

  <!-- Inner hot core -->
  <path fill="url(#flameHot)" opacity="0.95" d="M32 22
    C29.5 25 28.5 30 28.5 34
    C28.5 40 30 45 32 48
    C34 45 35.5 40 35.5 34
    C35.5 30 34.5 25 32 22 Z"/>

  <!-- Tail flames -->
  <g id="tail">
    <path fill="#ff3b10" d="M26 46c-1 4-4 7-6 9 4-1 7-2 9-5-1-1-2-2-3-4z"/>
    <path fill="#ff6a00" d="M32 48c0 5-1 9-1 12 2-3 3-6 3-10 0-1-1-2-2-2z"/>
    <path fill="#ff3b10" d="M38 46c1 4 4 7 6 9-4-1-7-2-9-5 1-1 2-2 3-4z"/>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 1.2; 0 0; 0 -0.6; 0 0" dur="1.4s" repeatCount="indefinite"/>
  </g>

  <!-- Head (profile right) -->
  <g>
    <path fill="#ffd24a" d="M33 20
      C35 18 38 17 40 18
      C41 19 41.5 21 40.5 22.5
      C39 24 36 24 34 23
      C33.2 22.5 32.8 21.2 33 20 Z"/>
    <path fill="#ff9a1f" d="M39.2 18.6c1.2-1.8 0.2-3.6-0.6-4.2 0.8 1.2 0.6 2.4 0.2 3.2-0.1 0.4 0.1 0.8 0.4 1z"/>
    <circle cx="38.6" cy="19.8" r="0.7" fill="#1a0505"/>
    <path fill="#ff7a14" d="M40.2 20.8c1.2 0.2 2.2 0.8 2.6 1.4-1.4-0.1-2.4-0.4-2.8-0.8z"/>
  </g>

  <!-- Rising flame wisps (CSS/SMIL pulse) -->
  <g id="wisps">
    <path fill="#ffe566" opacity="0.9" d="M20 24c-0.5-3 1.5-5 3-5.5-0.2 2 0.5 3.5 1.5 4.5-1.8 0.2-3.5 0.5-4.5 1z"/>
    <path fill="#ffe566" opacity="0.9" d="M44 24c0.5-3-1.5-5-3-5.5 0.2 2-0.5 3.5-1.5 4.5 1.8 0.2 3.5 0.5 4.5 1z"/>
    <animate attributeName="opacity" values="0.55;1;0.5;0.95;0.55" dur="1.1s" repeatCount="indefinite"/>
  </g>
</svg>
